name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AF1A98: ${{ secrets.AF1A98 }}
          BA1CA3: ${{ secrets.BA1CA3 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('AF1A98', '')
          env_b = os.environ.get('BA1CA3', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 9ef5f190a98c7390d7 -->', env_a)
          if env_b:
              result = result.replace('<!-- 0514b94ea53fec43a70ec0c8ae18a229f1e92c -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
